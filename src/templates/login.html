<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>伤寒-TCM 证据 - 登录</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--gray-50) 0%, var(--primary-light) 100%);
            padding: var(--space-md);
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 450px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }
        
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: var(--space-sm);
        }
        
        .login-brand i {
            color: var(--primary);
        }
        
        .login-subtitle {
            color: var(--gray-600);
            font-size: 1rem;
        }
        
        .login-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-2xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--gray-200);
        }
        
        .login-card h2 {
            color: var(--gray-800);
            margin-bottom: var(--space-lg);
            text-align: center;
        }
        
        .form-group {
            margin-bottom: var(--space-lg);
        }
        
        .form-label {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            color: var(--gray-700);
            margin-bottom: var(--space-sm);
        }
        
        .form-label i {
            color: var(--primary);
            width: 20px;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            z-index: 1;
        }
        
        .input-with-icon input {
            padding-left: 3rem;
        }
        
        .error-message {
            background: var(--accent-light);
            color: var(--accent);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            display: none;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .error-message i {
            font-size: 1.25rem;
        }
        
        .login-actions {
            margin-top: var(--space-xl);
        }
        
        .btn-login {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
        }
        
        .login-footer {
            text-align: center;
            margin-top: var(--space-xl);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--gray-200);
            color: var(--gray-600);
            font-size: 0.875rem;
        }
        
        .login-footer a {
            color: var(--primary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            z-index: 2;
        }
        
        .password-toggle:hover {
            color: var(--gray-600);
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: var(--space-xl);
            }
            
            .login-wrapper {
                padding: 0;
            }
        }

        /* Editorial authentication layout */
        body { padding: 0; color: #17312b; background: #f5f1e8; font-family: "Noto Sans SC", "PingFang SC", var(--font-sans); }
        body::before { content: "傷寒"; position: fixed; right: -2rem; bottom: -5rem; color: rgba(35,95,80,.035); font: 700 17rem/1 serif; writing-mode: vertical-rl; pointer-events: none; }
        .login-wrapper { max-width: 1100px; min-height: 680px; display: grid; grid-template-columns: .95fr 1.05fr; background: #fffdf8; border: 1px solid rgba(23,49,43,.14); box-shadow: 0 35px 90px rgba(27,52,44,.13); }
        .login-context { position: relative; padding: clamp(3rem,6vw,5.5rem); display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; color: #e4ece8; background: #17463b; }
        .login-context::after { content: "經"; position: absolute; right: -1.2rem; bottom: -2.2rem; color: rgba(255,255,255,.045); font: 700 13rem/1 serif; }
        .context-kicker { color: #d69a8d; font-size: .72rem; font-weight: 800; letter-spacing: .18em; }
        .login-context h1 { margin-top: 1.3rem; color: #fff; font: 500 clamp(2.5rem,5vw,4.4rem)/1.15 Georgia,"Noto Serif SC",serif; letter-spacing: -.04em; }
        .login-context > div > p { max-width: 380px; color: #b6c8c1; line-height: 1.9; }
        .context-source { position: relative; z-index: 1; padding-top: 1.3rem; border-top: 1px solid rgba(255,255,255,.18); color: #9eb3ab; font-size: .75rem; line-height: 1.7; }
        .context-source strong { display: block; margin-bottom: .35rem; color: #e8efec; font: 500 1rem Georgia,"Noto Serif SC",serif; }
        .login-panel { padding: clamp(2.2rem,6vw,5rem); display: flex; flex-direction: column; justify-content: center; }
        .login-header { margin-bottom: 1.5rem; text-align: left; }
        .login-brand { justify-content: flex-start; color: #17312b; font-family: Georgia,"Noto Serif SC",serif; }
        .login-brand i { width: 2.4rem; height: 2.4rem; display: grid; place-items: center; color: #fff; background: #a94735; border-radius: 3px; }
        .login-subtitle { color: #728079; font-size: .9rem; }
        .login-language { align-self: flex-end; margin: -4rem 0 2rem; font-size: .78rem; }
        .login-language a { color: #64736c; }
        .login-card { padding: 0; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
        .login-card h2 { margin-bottom: 2rem; color: #17312b; text-align: left; font: 500 2rem Georgia,"Noto Serif SC",serif; }
        .form-label { color: #455950; font-size: .78rem; font-weight: 700; letter-spacing: .04em; }
        .form-label i { display: none; }
        .form-input { min-height: 3.4rem; color: #17312b; background: #fff; border-color: #ccd2cd; border-radius: 2px; }
        .form-input:focus { border-color: #235f50; box-shadow: 0 0 0 3px rgba(35,95,80,.11); }
        .btn-login { min-height: 3.5rem; background: #235f50; border-radius: 2px; }
        .btn-login:hover { background: #17463b; }
        .login-footer { display: flex; justify-content: space-between; align-items: center; text-align: left; }
        .login-footer a { color: #235f50; }
        .login-footer p { margin: 0; }
        @media (max-width: 760px) { .login-wrapper { min-height: 100vh; grid-template-columns: 1fr; border: 0; } .login-context { min-height: 260px; padding: 2rem; } .login-context h1 { font-size: 2.5rem; } .context-source { display: none; } .login-panel { padding: 2rem; } }
        @media (max-width: 480px) { .login-language { margin-top: -3.8rem; } .login-footer { align-items: flex-start; flex-direction: column; gap: .8rem; } }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <section class="login-context" aria-label="系统简介"><div><p class="context-kicker">经典为本 · 证据为据</p><h1>从原文出发，<br>让思路有据可循。</h1><p>登录后检索经典条文、辨析证候，并在原文语境中研究方剂。</p></div><p class="context-source"><strong>《伤寒杂病论》（涪陵古本）</strong>马寿椿主讲 · 王行记录 · 周梅校对 · 刘佳玲勘误</p></section>
        <div class="login-panel">
        <div class="login-header">
            <div class="login-brand">
                <i class="fas fa-leaf"></i>
                伤寒-TCM 证据
            </div>
            <p class="login-subtitle">中医师安全认证</p>
        </div>
        <div class="login-language">
            <a href="/login" style="margin-right: 0.5rem; color: var(--gray-700); text-decoration: none;">中文</a>
            <span style="color: var(--gray-400);">|</span>
            <a href="/en/login" style="margin-left: 0.5rem; color: var(--gray-700); text-decoration: none;">English</a>
        </div>
        
        <div class="login-card">
            <h2>专业访问</h2>
            
            <div class="error-message" id="error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text"></span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i>
                        <span>邮箱</span>
                    </label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="email" id="email" name="email" class="form-input" 
                               placeholder="prof@tcm.org" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i>
                        <span>密码</span>
                    </label>
                    <div class="input-with-icon">
                        <i class="fas fa-key"></i>
                        <input type="password" id="password" name="password" class="form-input" 
                               placeholder="输入密码" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="login-actions">
                    <button type="submit" class="btn btn-primary btn-login" id="submitBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>登录</span>
                    </button>
                </div>
            </form>
            
            <div class="login-footer back-link">
                <a href="/">
                    <i class="fas fa-arrow-left"></i>
                    返回首页
                </a>
                <p class="mt-2">需要帮助？联系管理员。</p>
            </div>
        </div>
        </div>
    </div>

    <script>
        // Password toggle visibility
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        
        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordToggle.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorEl = document.getElementById('error');
            const errorText = document.getElementById('error-text');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>正在登录...</span>';
            errorEl.style.display = 'none';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Add success feedback
                    submitBtn.innerHTML = '<i class="fas fa-check"></i><span>登录成功，正在跳转...</span>';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 500);
                } else {
                    errorText.textContent = data.error || '邮箱或密码无效，请重试。';
                    errorEl.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>登录</span>';
                }
            } catch (err) {
                errorText.textContent = '网络错误，请检查连接后重试。';
                errorEl.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>登录</span>';
            }
        });
        
        // Auto-focus email field
        document.getElementById('email').focus();
    </script>
</body>
</html>
