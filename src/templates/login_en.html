<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shanghan-TCM Evidence - Login</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--gray-50) 0%, var(--primary-light) 100%);
            padding: var(--space-md);
        }
        
        .login-wrapper {
            width: 100%;
            max-width: 450px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }
        
        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gray-900);
            margin-bottom: var(--space-sm);
        }
        
        .login-brand i {
            color: var(--primary);
        }
        
        .login-subtitle {
            color: var(--gray-600);
            font-size: 1rem;
        }
        
        .login-card {
            background: white;
            border-radius: var(--radius-xl);
            padding: var(--space-2xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--gray-200);
        }
        
        .login-card h2 {
            color: var(--gray-800);
            margin-bottom: var(--space-lg);
            text-align: center;
        }
        
        .form-group {
            margin-bottom: var(--space-lg);
        }
        
        .form-label {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            color: var(--gray-700);
            margin-bottom: var(--space-sm);
        }
        
        .form-label i {
            color: var(--primary);
            width: 20px;
        }
        
        .input-with-icon {
            position: relative;
        }
        
        .input-with-icon i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            z-index: 1;
        }
        
        .input-with-icon input {
            padding-left: 3rem;
        }
        
        .error-message {
            background: var(--accent-light);
            color: var(--accent);
            padding: var(--space-md);
            border-radius: var(--radius-md);
            margin-bottom: var(--space-lg);
            display: none;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .error-message i {
            font-size: 1.25rem;
        }
        
        .login-actions {
            margin-top: var(--space-xl);
        }
        
        .btn-login {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
        }
        
        .login-footer {
            text-align: center;
            margin-top: var(--space-xl);
            padding-top: var(--space-lg);
            border-top: 1px solid var(--gray-200);
            color: var(--gray-600);
            font-size: 0.875rem;
        }
        
        .login-footer a {
            color: var(--primary);
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
        }
        
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            z-index: 2;
        }
        
        .password-toggle:hover {
            color: var(--gray-600);
        }
        
        @media (max-width: 480px) {
            .login-card {
                padding: var(--space-xl);
            }
            
            .login-wrapper {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-header">
            <div class="login-brand">
                <i class="fas fa-leaf"></i>
                Shanghan-TCM Evidence
            </div>
            <p class="login-subtitle">Secure authentication for TCM practitioners</p>
        </div>
        <div style="text-align: right; margin-bottom: 1rem;">
            <a href="/login" style="margin-right: 0.5rem; color: var(--gray-700); text-decoration: none;">中文</a>
            <span style="color: var(--gray-400);">|</span>
            <a href="/en/login" style="margin-left: 0.5rem; color: var(--gray-700); text-decoration: none;">English</a>
        </div>
        
        <div class="login-card">
            <h2>Professional Access</h2>
            
            <div class="error-message" id="error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text"></span>
            </div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label for="email" class="form-label">
                        <i class="fas fa-envelope"></i>
                        <span>Email</span>
                    </label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="email" id="email" name="email" class="form-input" 
                               placeholder="prof@tcm.org" required autocomplete="email">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">
                        <i class="fas fa-lock"></i>
                        <span>Password</span>
                    </label>
                    <div class="input-with-icon">
                        <i class="fas fa-key"></i>
                        <input type="password" id="password" name="password" class="form-input" 
                               placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="login-actions">
                    <button type="submit" class="btn btn-primary btn-login" id="submitBtn">
                        <i class="fas fa-sign-in-alt"></i>
                        <span>Sign In</span>
                    </button>
                </div>
            </form>
            
            <div class="login-footer">
                <a href="/en">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </a>
                <p class="mt-2">Need assistance? Contact admin.</p>
            </div>
        </div>
    </div>

    <script>
        // Password toggle visibility
        const passwordToggle = document.getElementById('passwordToggle');
        const passwordInput = document.getElementById('password');
        
        passwordToggle.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            passwordToggle.innerHTML = type === 'password' ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
        });
        
        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorEl = document.getElementById('error');
            const errorText = document.getElementById('error-text');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Signing in...</span>';
            errorEl.style.display = 'none';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({email, password})
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Add success feedback
                    submitBtn.innerHTML = '<i class="fas fa-check"></i><span>Success! Redirecting...</span>';
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 500);
                } else {
                    errorText.textContent = data.error || 'Invalid email or password. Please try again.';
                    errorEl.style.display = 'flex';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
                }
            } catch (err) {
                errorText.textContent = 'Network error. Please check your connection and try again.';
                errorEl.style.display = 'flex';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i><span>Sign In</span>';
            }
        });
        
        // Auto-focus email field
        document.getElementById('email').focus();
    </script>
</body>
</html>
